<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content=" " />
    <title>World clock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select name="" id="">
        <option value="">Choose city</option>
        <option value="">Nairobi</option>
        <option value="">Egypt</option>
        <option value="">London</option>
        <option value="">Kiribati</option>
        <option value="">Baker Island</option>
      </select>

      <div class="city">
        <div class="city-day">
          <h2>Nairobi</h2>
          <p class="day" id="nairobi-date"></p>
        </div>
        <div class="city-time">
          <h3 class="time" id="nairobi-time"></h3>
          <p id="ampm"></p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>Egypt</h2>
          <p class="day" id="egypt-date"></p>
        </div>
        <div class="city-time">
          <h3 class="time" id="egypt-time"></h3>
          <p id="egypt-ampm"></p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>London</h2>
          <p class="day" id="london-date"></p>
        </div>
        <div class="city-time">
          <h3 class="time" id="london-time"></h3>
          <p id="london-ampm"></p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>China</h2>
          <p class="day" id="china-date"></p>
        </div>
        <div class="city-time">
          <h3 class="time" id="china-time"></h3>
          <p id="china-ampm"></p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>Kiribati</h2>
          <p class="day" id="kiribati-date"></p>
        </div>
        <div class="city-time">
          <h3 class="time" id="kiribati-time"></h3>
          <p id="kiribati-ampm"></p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>Baker Island(USA)</h2>
          <p class="day" id="baker-date"></p>
        </div>
        <div class="city-time">
          <h3 class="time" id="baker-time"></h3>
          <p id="baker-ampm"></p>
        </div>
      </div>
    </div>

    <footer>
      This project was coded by
      <a href="https://github.com/carolkithinji35-ai" target="_blank"
        >carol kithinji</a
      >, is open-sourced on
      <a
        href="https://github.com/carolkithinji35-ai/World-clock-project"
        target="_blank"
        >GitHub</a
      >
      and hosted by
      <a href="https://lorac-world-clock.netlify.app/" target="_blank"
        >Netlify</a
      >.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
