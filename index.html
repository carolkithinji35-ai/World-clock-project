<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content=" " />
    <title>World clock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select name="" id="">
        <option value="">Choose city</option>
        <option value="">Nairobi</option>
        <option value="">Egypt</option>
        <option value="">London</option>
        <option value="">China</option>
        <option value="">Russia</option>
      </select>

      <div class="city">
        <div class="city-day">
          <h2>Nairobi</h2>
          <p class="day">March 4th, 2022</p>
        </div>
        <div class="city-time">
          <h3 class="time">12:00:00</h3>
          <p>AM</p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>Egypt</h2>
          <p class="day">March 4th, 2022</p>
        </div>
        <div class="city-time">
          <h3 class="time">12:00:00</h3>
          <p>AM</p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>London</h2>
          <p class="day">March 4th, 2022</p>
        </div>
        <div class="city-time">
          <h3 class="time">12:00:00</h3>
          <p>AM</p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>China</h2>
          <p class="day">March 4th, 2022</p>
        </div>
        <div class="city-time">
          <h3 class="time">12:00:00</h3>
          <p>AM</p>
        </div>
      </div>
      <div class="city">
        <div class="city-day">
          <h2>Russia</h2>
          <p class="day">March 4th, 2022</p>
        </div>
        <div class="city-time">
          <h3 class="time">12:00:00</h3>
          <p>AM</p>
        </div>
      </div>


    </div>

    <footer>
      This project was coded by
      <a href="https://github.com/carolkithinji35-ai" target="_blank"
        >carol kithinji</a
      >, is open-sourced on
      <a
        href="https://github.com/carolkithinji35-ai/World-clock-project"
        target="_blank"
        >GitHub</a
      >
      and hosted by
      <a href="https://lorac-world-clock.netlify.app/" target="_blank"
        >Netlify</a
      >.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
